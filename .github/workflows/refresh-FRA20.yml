name: "Refresh FRA20 - FRA20 Production Control"

# Generated by `python -m build new-project`. Refreshes the FRA20 page from VisiLean
# (3 API calls: task history, commitments, constraint log) and publishes it to the gh-pages
# branch, then asks the portfolio workflow to rebuild the landing page.
# Token: repository secret VL_TOKEN_FRA20.

on:
  schedule:
    - cron: "29 4 * * *"   # 09:59 IST
    - cron: "29 10 * * *"   # 15:59 IST
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages
  actions: write    # start the portfolio workflow

concurrency:
  group: refresh-FRA20
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # last good copy of the feeds: an outage gives a "stale" page instead of an empty one
      - name: Restore last good data
        uses: actions/cache@v4
        with:
          path: .cache
          key: vl-feed-FRA20-${{ github.run_id }}
          restore-keys: |
            vl-feed-FRA20-

      - name: Self-test calculation logic
        run: python -m build selftest

      - name: Fetch the published site
        run: bash .github/scripts/pages.sh fetch

      - name: Build FRA20
        id: build
        env:
          VL_TOKEN_FRA20: ${{ secrets.VL_TOKEN_FRA20 }}
        run: |
          set -uo pipefail
          python -m build build --project "FRA20" --source live --no-landing | tee build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || [ "$code" = "2" ] || exit "$code"

      - name: Validate
        run: python -m build validate --project "FRA20"

      - name: Scan for credentials
        run: bash .github/scripts/pages.sh scan "FRA20"

      - name: Publish FRA20
        run: bash .github/scripts/pages.sh publish "Refresh FRA20" "FRA20"

      - name: Refresh the portfolio page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run portfolio.yml --ref "${{ github.ref_name }}"

      # after publishing, so the page still shows the last good data
      - name: Report problems
        run: |
          state=$(python -c "import json; print(json.load(open('dist/FRA20/build.json'))['state'])")
          echo "### FRA20: $state" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outputs.code }}" = "2" ]; then
            echo "::error title=VisiLean token rejected::Fix repository secret VL_TOKEN_FRA20"; exit 1
          fi
          if [ "$state" = "unavailable" ]; then
            echo "::error title=No data::FRA20 has no data: check secret VL_TOKEN_FRA20 and the project GUID"; exit 1
          fi
