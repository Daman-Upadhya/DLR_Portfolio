name: "Refresh PAR14 - PAR14 Production Control"

# Generated by `python -m build new-project`. Refreshes the PAR14 page from VisiLean
# (3 API calls: task history, commitments, constraint log) and publishes it to the gh-pages
# branch, then asks the portfolio workflow to rebuild the landing page.
# Token: repository secret VL_TOKEN_PAR14.

on:
  schedule:
    - cron: "21 4 * * *"   # 09:51 IST
    - cron: "21 10 * * *"   # 15:51 IST
  workflow_dispatch:

permissions:
  contents: write   # push to gh-pages
  actions: write    # start the portfolio workflow

concurrency:
  group: refresh-PAR14
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # last good copy of the feeds: an outage gives a "stale" page instead of an empty one
      - name: Restore last good data
        uses: actions/cache@v4
        with:
          path: .cache
          key: vl-feed-PAR14-${{ github.run_id }}
          restore-keys: |
            vl-feed-PAR14-

      - name: Self-test calculation logic
        run: python -m build selftest

      - name: Fetch the published site
        run: bash .github/scripts/pages.sh fetch

      - name: Build PAR14
        id: build
        env:
          VL_TOKEN_PAR14: ${{ secrets.VL_TOKEN_PAR14 }}
        run: |
          set -uo pipefail
          python -m build build --project "PAR14" --source live --no-landing | tee build.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || [ "$code" = "2" ] || exit "$code"

      - name: Validate
        run: python -m build validate --project "PAR14"

      - name: Scan for credentials
        run: bash .github/scripts/pages.sh scan "PAR14"

      - name: Publish PAR14
        run: bash .github/scripts/pages.sh publish "Refresh PAR14" "PAR14"

      - name: Refresh the portfolio page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run portfolio.yml --ref "${{ github.ref_name }}"

      # after publishing, so the page still shows the last good data
      - name: Report problems
        run: |
          state=$(python -c "import json; print(json.load(open('dist/PAR14/build.json'))['state'])")
          echo "### PAR14: $state" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.build.outputs.code }}" = "2" ]; then
            echo "::error title=VisiLean token rejected::Fix repository secret VL_TOKEN_PAR14"; exit 1
          fi
          if [ "$state" = "unavailable" ]; then
            echo "::error title=No data::PAR14 has no data: check secret VL_TOKEN_PAR14 and the project GUID"; exit 1
          fi
